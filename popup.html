<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCSD EZPLAN</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">EZ</span>
        <span class="brand-name">UCSD EZPLAN</span>
      </div>
      <div id="term-badge" class="term-badge" title="Current term">—</div>
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search courses (e.g. PHYS 002C, CSE 12)..." autocomplete="off">
        <button id="search-btn" class="btn btn-primary">Search</button>
      </div>
    </header>

    <div id="auth-banner" class="auth-banner hidden">
      <span class="auth-icon">!</span>
      <span id="auth-text" class="auth-text"></span>
    </div>

    <div id="search-results" class="search-results hidden">
      <div class="results-header">Results <span id="results-count" class="results-count">0</span></div>
      <ul id="results-list" class="results-list"></ul>
    </div>

    <section id="calendar-section" class="calendar-section">
      <div class="section-head">
        <h2>Weekly Calendar</h2>
        <div class="calendar-controls">
          <label class="toggle">
            <input id="show-finals" type="checkbox">
            <span>Show finals</span>
          </label>
        </div>
      </div>
      <div id="calendar" class="calendar">
        <div class="time-axis" id="time-axis"></div>
        <div class="day-columns" id="day-columns">
          <div class="day-col" data-day="M">
            <div class="day-head">Mon</div>
            <div class="day-body"></div>
          </div>
          <div class="day-col" data-day="Tu">
            <div class="day-head">Tue</div>
            <div class="day-body"></div>
          </div>
          <div class="day-col" data-day="W">
            <div class="day-head">Wed</div>
            <div class="day-body"></div>
          </div>
          <div class="day-col" data-day="Th">
            <div class="day-head">Thu</div>
            <div class="day-body"></div>
          </div>
          <div class="day-col" data-day="F">
            <div class="day-head">Fri</div>
            <div class="day-body"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="planned-section" class="planned-section">
      <div class="section-head">
        <h2>Planned Classes <span id="planned-count" class="count-badge">0</span></h2>
      </div>
      <div id="planned-list" class="planned-list"></div>
      <div id="planned-empty" class="planned-empty hidden">
        No classes planned yet. Search above and add a section to get started.
      </div>
    </section>

  </div>
  <script src="popup.js"></script>
</body>
</html>
